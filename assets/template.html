<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Repo World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#10101c;--panel:#1d1b2e;--panel2:#2b2845;--ink:#f6f1e1;--dim:#a39fbf;--gold:#f9c74f;--good:#90be6d;--bad:#f94144;--line:#4b4670}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Press Start 2P",ui-monospace,monospace;touch-action:none;-webkit-user-select:none;user-select:none}
canvas#game{display:block;width:100vw;height:100vh;image-rendering:pixelated;cursor:pointer;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
.px{border:3px solid var(--line);box-shadow:0 0 0 3px #0008,inset 0 0 0 2px #0004;background:var(--panel)}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:9px;line-height:1.6}
#hud>div{pointer-events:auto;padding:8px 10px}
#where small{color:var(--dim);display:block;font-size:8px}
#stats{display:flex;align-items:center;gap:10px}
#stats button{background:var(--panel2);border:2px solid var(--line);padding:6px 8px;font-size:9px}
#xpbar{width:70px;height:8px;background:#0006;border:2px solid var(--line)}
#xpbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
#dialog{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,calc(100vw - 20px));padding:14px 16px 18px;display:none;font-size:11px;line-height:1.9;z-index:5}
#dialog h3{font-size:10px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#dialog h3 span.tag{font-size:7px;padding:3px 5px;background:var(--panel2);color:var(--dim)}
#dialog p{min-height:3.8em;word-break:break-word}
#dialog .more{position:absolute;right:12px;bottom:6px;font-size:9px;color:var(--gold);animation:blink 1s steps(2) infinite}
#dialog code{color:var(--gold);font-family:inherit}
@keyframes blink{50%{opacity:0}}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:8;padding:12px}
.modal>.px{width:min(720px,100%);max-height:88vh;overflow:auto;padding:16px;font-size:10px;line-height:1.8}
.modal h2{font-size:12px;margin-bottom:12px;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.modal h2 button{background:var(--panel2);border:2px solid var(--line);padding:4px 8px;font-size:9px;color:var(--ink)}
.quest{padding:10px;border:2px solid var(--line);margin-bottom:8px;background:var(--panel2)}
.quest.done{opacity:.5}.quest.active{border-color:var(--gold)}
.quest b{display:block;margin-bottom:4px}.quest small{color:var(--dim);font-size:8px}
#minimap{width:100%;image-rendering:pixelated;background:#0b0b14;border:2px solid var(--line);touch-action:manipulation}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:radial-gradient(ellipse at center,#2b2550 0%,#10101c 70%);padding:16px}
#title .card{text-align:center;max-width:620px}
#title h1{font-size:clamp(20px,6vw,40px);color:var(--gold);text-shadow:4px 4px 0 #a4161a,8px 8px 0 #0008;margin-bottom:14px;letter-spacing:2px}
#title .repo{font-size:clamp(11px,3vw,15px);margin-bottom:6px}
#title .tagline{font-size:9px;color:var(--dim);margin-bottom:22px;line-height:1.8}
#title .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
#title .grid div{padding:10px 4px;font-size:8px;color:var(--dim)}
#title .grid b{display:block;font-size:13px;color:var(--ink);margin-bottom:6px}
#start{background:var(--gold);color:#1d1b2e;border:none;padding:14px 26px;font-size:12px;box-shadow:0 5px 0 #b5830f}
#start:active{transform:translateY(3px);box-shadow:0 2px 0 #b5830f}
#title .keys{margin-top:20px;font-size:8px;color:var(--dim);line-height:2}
#pad{position:fixed;inset:auto 0 calc(18px + env(safe-area-inset-bottom)) 0;display:none;justify-content:space-between;padding:0 18px;pointer-events:none;z-index:4}
#dpad{position:relative;width:138px;height:138px;pointer-events:auto}
#dpad button,#abtn{position:absolute;width:46px;height:46px;background:#1d1b2ecc;border:3px solid var(--line);font-size:14px;touch-action:none}
#dpad [data-k=up]{left:46px;top:0}#dpad [data-k=down]{left:46px;bottom:0}#dpad [data-k=left]{left:0;top:46px}#dpad [data-k=right]{right:0;top:46px}
#abtn{position:relative;width:66px;height:66px;border-radius:50%;background:#a4161acc;border-color:#f94144;pointer-events:auto;align-self:flex-end;font-size:16px}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);padding:10px 14px;font-size:10px;display:none;z-index:9;color:var(--gold);text-align:center;line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 0;font-size:8px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
body.talking #dpad{visibility:hidden}
@media (max-width:560px){#hud{font-size:8px}#xpbar{width:44px}#dialog{font-size:10px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="px" id="where">…</div>
  <div class="px" id="stats">
    <span id="lvl">LV 1</span><div id="xpbar"><i></i></div>
    <button id="btnQ" aria-label="Quests">📜</button><button id="btnM" aria-label="Map">🗺</button>
  </div>
</div>

<div id="dialog" class="px" role="dialog" aria-live="polite"><h3 id="dname"></h3><p id="dtext"></p><span class="more">▼</span></div>
<div id="toast" class="px"></div>

<div class="modal" id="mQuest"><div class="px"><h2>📜 Quest Log <button data-close>✕</button></h2><div id="qlist"></div></div></div>
<div class="modal" id="mMap"><div class="px"><h2>🗺 World Map <button data-close>✕</button></h2>
  <canvas id="minimap"></canvas>
  <div class="legend" id="legend"></div>
  <div style="font-size:8px;color:var(--dim)">Click anywhere to fast-travel. Lines = imports between districts.</div>
</div></div>

<div id="pad"><div id="dpad"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="down">▼</button></div><button id="abtn">A</button></div>

<div id="title"><div class="card">
  <h1>REPO WORLD</h1>
  <div class="repo" id="tRepo"></div>
  <div class="tagline" id="tTag"></div>
  <div class="grid" id="tGrid"></div>
  <button id="start">▶ PRESS START</button>
  <div class="keys">WASD / ARROWS move · E / SPACE talk<br>Q quests · M map · ESC close<br>CLICK to travel · WHEEL / +- zoom</div>
</div></div>

<script>
"use strict";
const WORLD = "__WORLD_JSON__";
const LORE = "__LORE_JSON__";

/* ---------- utils ---------- */
const T = 16, $ = s => document.querySelector(s);
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rand = mulberry(hash(WORLD.meta.name));
const base = p => p.split('/').pop();
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 1e4 ? 0 : 1) + 'k' : String(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const safe = s => esc(s).replace(/&lt;(\/?)code&gt;/g, '<$1code>'); // lore may only use <code>
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const ROLES = {
  controller: ['#3a86ff', 'Gatekeeper'], model: ['#2a9d8f', 'Record Keeper'], service: ['#8338ec', 'Craftsman'],
  middleware: ['#e76f51', 'Guard'], job: ['#f4a261', 'Messenger'], request: ['#e9b100', 'Scribe'],
  component: ['#fb5607', 'Artisan'], store: ['#06a77d', 'Banker'], hook: ['#ef476f', 'Hookmaster'],
  route: ['#118ab2', 'Pathfinder'], config: ['#6c757d', 'Elder'], util: ['#9c6644', 'Tinkerer'],
  test: ['#8d99ae', 'Inspector'], migration: ['#7f5539', 'Mason'], view: ['#d4a373', 'Painter'], other: ['#b5838d', 'Villager'],
};
const QUARTER = {
  controller: "Gatekeepers' Quarter", model: 'The Archives', service: "Craftsmen's Row", middleware: 'The Watchtower',
  job: 'Courier Docks', request: "Scribes' Hall", component: "Artisans' Market", store: 'Bank District', hook: 'Hook Bay',
  route: 'Crossroads', config: "Elders' Keep", util: "Tinkerers' Alley", test: 'Training Grounds', migration: 'The Quarry',
  view: 'Gallery Lane', other: 'Old Town',
};
const role = r => ROLES[r] || ROLES.other;

/* ---------- world model ---------- */
const lore = LORE || {};
const LD = lore.districts || {}, LN = lore.npcs || {};
const files = {};      // path -> file (+district)
const blocks = [];     // laid-out districts
WORLD.districts.forEach(d => {
  const L = LD[d.name] || {};
  const b = { ...d, type: 'code', title: L.name || QUARTER[d.mainRole] || 'Old Town', lore: L.lore, items: d.files };
  d.files.forEach(f => { f.district = b; files[f.path] = f; });
  blocks.push(b);
});
if (WORLD.graveyard?.length) blocks.push({ id: 'grave', name: 'graveyard', title: lore.graveyardName || 'The Graveyard', type: 'grave', items: WORLD.graveyard, mainRole: 'migration' });
if (WORLD.heroes?.length) blocks.push({ id: 'heroes', name: 'hall-of-heroes', title: lore.heroesName || 'Hall of Heroes', type: 'heroes', items: WORLD.heroes, mainRole: 'config' });
if (WORLD.cycles?.length) blocks.push({ id: 'rift', name: 'the-rift', title: lore.riftName || 'The Rift', type: 'rift', items: WORLD.cycles, mainRole: 'hook' });

/* ---------- layout: shelf packing ---------- */
const G = 4, EDGE = 3;
blocks.forEach(b => {
  const n = b.items.length;
  b.cols = Math.max(3, Math.min(14, Math.ceil(Math.sqrt(n * 1.6))));
  b.rows = Math.ceil(n / b.cols);
  b.w = b.cols * 4 + 3; b.h = b.rows * 4 + 4;
});
(() => {
  const area = blocks.reduce((s, b) => s + (b.w + G) * (b.h + G), 0);
  const maxW = Math.max(Math.ceil(Math.sqrt(area) * 1.3), ...blocks.map(b => b.w));
  const sorted = [...blocks].sort((a, b) => b.h - a.h);
  let x = 0, y = 0, rowH = 0;
  sorted.forEach(b => {
    if (x && x + b.w > maxW) { x = 0; y += rowH + G; rowH = 0; }
    b.x = EDGE + G + x; b.y = EDGE + G + y; x += b.w + G; rowH = Math.max(rowH, b.h);
  });
})();
const MW = Math.max(...blocks.map(b => b.x + b.w)) + G + EDGE;
const MH = Math.max(...blocks.map(b => b.y + b.h)) + G + EDGE;
const ROAD = 0, GRASS = 1, FENCE = 2, BLD = 3, TREE = 4;
const grid = new Uint8Array(MW * MH);
const at = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? TREE : grid[y * MW + x];
const put = (x, y, v) => { if (x >= 0 && y >= 0 && x < MW && y < MH) grid[y * MW + x] = v; };
for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (x < EDGE || y < EDGE || x >= MW - EDGE || y >= MH - EDGE) put(x, y, TREE);

const actors = []; // interactables
blocks.forEach(b => {
  for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) {
    const edge = x === b.x || y === b.y || x === b.x + b.w - 1 || y === b.y + b.h - 1;
    put(x, y, edge ? FENCE : GRASS);
  }
  const mx = b.x + (b.w >> 1), my = b.y + (b.h >> 1);
  [[mx - 1, b.y], [mx, b.y], [mx - 1, b.y + b.h - 1], [mx, b.y + b.h - 1], [b.x, my], [b.x, my - 1], [b.x + b.w - 1, my], [b.x + b.w - 1, my - 1]].forEach(([x, y]) => put(x, y, GRASS));
  b.gate = { x: mx, y: b.y - 1 };
  actors.push({ kind: 'sign', x: b.x + 2.5, y: b.y + 2, block: b });
  b.items.forEach((it, i) => {
    const cx = b.x + 2 + (i % b.cols) * 4, cy = b.y + 3 + Math.floor(i / b.cols) * 4;
    if (b.type === 'code') {
      for (let yy = 0; yy < 2; yy++) for (let xx = 0; xx < 3; xx++) put(cx + xx, cy + yy, BLD);
      it.cx = cx; it.cy = cy;
      actors.push({ kind: it.boss ? 'boss' : 'npc', x: cx + 1.5, y: cy + 2.85, file: it, seed: hash(it.path) });
    } else if (b.type === 'grave') { put(cx + 1, cy + 1, BLD); actors.push({ kind: 'tomb', x: cx + 1.5, y: cy + 2.6, grave: it, tx: cx + 1, ty: cy + 1 }); }
    else if (b.type === 'heroes') { put(cx + 1, cy + 1, BLD); actors.push({ kind: 'hero', x: cx + 1.5, y: cy + 2.6, hero: it, rank: i, tx: cx + 1, ty: cy + 1 }); }
    else if (b.type === 'rift') { actors.push({ kind: 'portal', x: cx + 1.5, y: cy + 1.8, cycle: it, seed: i }); }
  });
});
const solid = (tx, ty) => { const v = at(tx, ty); return v === FENCE || v === BLD || v === TREE; };

/* ---------- pixel art ---------- */
const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255; const k = f < 0 ? 0 : 255, p = Math.abs(f); r = Math.round((k - r) * p + r); g = Math.round((k - g) * p + g); b = Math.round((k - b) * p + b); return `rgb(${r},${g},${b})`; };
const map = document.createElement('canvas'); map.width = MW * T; map.height = MH * T;
const m = map.getContext('2d');
const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };

function drawGround() {
  for (let ty = 0; ty < MH; ty++) for (let tx = 0; tx < MW; tx++) {
    const v = at(tx, ty), px = tx * T, py = ty * T, r = mulberry(tx * 7919 + ty * 104729);
    if (v === ROAD) {
      R(m, px, py, T, T, '#c9b48a');
      for (let i = 0; i < 4; i++) R(m, px + ((r() * 14) | 0), py + ((r() * 14) | 0), 2 + (r() * 3 | 0), 2, r() < .5 ? '#b49e74' : '#d8c59c');
    } else if (v === TREE) {
      R(m, px, py, T, T, '#3f7d3a');
      R(m, px + 2, py + 1, 12, 11, '#2d5e2c'); R(m, px + 3, py + 2, 9, 7, '#3a7a36'); R(m, px + 5, py + 3, 3, 3, '#56a04c'); R(m, px + 7, py + 12, 2, 4, '#6b4423');
    } else {
      R(m, px, py, T, T, '#5aa34a');
      for (let i = 0; i < 5; i++) R(m, px + ((r() * 15) | 0), py + ((r() * 15) | 0), 1, 2, r() < .6 ? '#4c9140' : '#6fb85c');
      if (r() < .04) { R(m, px + 6, py + 6, 2, 2, ['#ffd166', '#ef476f', '#ffffff'][(r() * 3) | 0]); }
    }
  }
}
function drawFence(b) {
  for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) {
    if (at(x, y) !== FENCE) continue;
    const px = x * T, py = y * T, horiz = y === b.y || y === b.y + b.h - 1;
    if (horiz) { R(m, px, py + 6, T, 2, '#8b5a2b'); R(m, px, py + 11, T, 2, '#8b5a2b'); R(m, px + 2, py + 3, 3, 12, '#a0693a'); R(m, px + 11, py + 3, 3, 12, '#a0693a'); }
    else { R(m, px + 6, py, 2, T, '#8b5a2b'); R(m, px + 6, py + 2, 4, 4, '#a0693a'); R(m, px + 6, py + 10, 4, 4, '#a0693a'); }
  }
}
function drawHouse(f) {
  const px = f.cx * T, py = f.cy * T, [col] = role(f.role), r = mulberry(hash(f.path));
  if (f.boss) {
    R(m, px + 2, py - 14, 44, 46, '#2b1f3a'); R(m, px + 2, py - 14, 44, 4, '#1a1226');
    for (let i = 0; i < 5; i++) R(m, px + 2 + i * 9, py - 20, 6, 6, '#2b1f3a');
    for (let i = 0; i < 3; i++) { R(m, px + 9 + i * 12, py - 4, 5, 7, '#ff4d6d'); R(m, px + 9 + i * 12, py + 10, 5, 7, '#ff4d6d'); }
    R(m, px + 19, py + 20, 10, 12, '#120b1a');
    return;
  }
  const big = f.loc > 180, h = big ? 22 : 16, top = py + 32 - h - 8;
  R(m, px + 2, top + 8, 44, h, '#efe3c8'); R(m, px + 2, top + 8 + h - 3, 44, 3, '#cdbf9f');
  for (let i = 0; i < 3; i++) R(m, px + 6 + i * 14, top + 12, 6, 6, '#7ec8e3'), R(m, px + 6 + i * 14, top + 12, 6, 2, '#5aa3c0');
  if (big) for (let i = 0; i < 3; i++) if (i !== 1) R(m, px + 6 + i * 14, top + 21, 6, 5, '#7ec8e3');
  R(m, px + 20, py + 22, 8, 10, shade(col, -.45)); R(m, px + 26, py + 27, 1, 1, '#ffd166');
  for (let i = 0; i < 9; i++) R(m, px + i * 2 - 1 + 2, top - i + 9, 48 - i * 4 + 0, 2, i % 2 ? col : shade(col, -.15));
  R(m, px, top + 7, 48, 3, shade(col, -.35));
  if (r() < .5) R(m, px + 36, top - 4, 5, 9, '#7f5539');
  if (f.todos) R(m, px + 4, py + 26, 6, 6, '#fff3b0'), R(m, px + 5, py + 27, 4, 1, '#c9a227');
}
function drawSpecial(b) {
  b.items.forEach((it, i) => {
    const cx = b.x + 2 + (i % b.cols) * 4, cy = b.y + 3 + Math.floor(i / b.cols) * 4, px = (cx + 1) * T, py = (cy + 1) * T;
    if (b.type === 'grave') { R(m, px + 2, py + 2, 12, 14, '#8d8f9c'); R(m, px + 3, py + 1, 10, 2, '#8d8f9c'); R(m, px + 4, py, 8, 1, '#8d8f9c'); R(m, px + 7, py + 4, 2, 7, '#5c5e6b'); R(m, px + 5, py + 6, 6, 2, '#5c5e6b'); R(m, px + 1, py + 15, 14, 2, '#3e6b34'); }
    if (b.type === 'heroes') { const gold = i === 0; R(m, px + 1, py + 10, 14, 6, '#6c757d'); R(m, px + 2, py + 11, 12, 1, gold ? '#f9c74f' : '#adb5bd'); R(m, px + 5, py - 6, 6, 6, gold ? '#e0b43c' : '#b8bcc4'); R(m, px + 4, py, 8, 10, gold ? '#d4a017' : '#9aa0a8'); R(m, px + 3, py + 1, 2, 5, gold ? '#d4a017' : '#9aa0a8'); R(m, px + 11, py - 3, 2, 8, gold ? '#d4a017' : '#9aa0a8'); }
    if (b.type === 'rift') { R(m, px - 8, py + 4, 32, 12, '#3c1c4d'); R(m, px - 6, py + 6, 28, 8, '#271233'); }
  });
}
function drawSign(b) {
  const px = (b.x + 2) * T, py = (b.y + 1) * T + 2;
  m.font = '8px "Press Start 2P", monospace';
  const t1 = b.type === 'code' ? b.name : b.title, t2 = b.type === 'code' ? b.title : '';
  const w = Math.min((b.w - 4) * T, Math.max(m.measureText(t1).width, m.measureText(t2).width) + 16);
  R(m, px + 6, py + 20, 4, 8, '#6b4423'); R(m, px, py, w, 22, '#8b5a2b'); R(m, px + 2, py + 2, w - 4, 18, '#b07d48');
  m.fillStyle = '#2b1a0d'; m.fillText(t1, px + 8, py + 11, w - 14);
  if (t2) { m.fillStyle = '#5a3a1a'; m.font = '6px "Press Start 2P", monospace'; m.fillText(t2, px + 8, py + 19, w - 14); }
}
function renderMap() {
  drawGround(); blocks.forEach(drawFence);
  blocks.forEach(b => { if (b.type === 'code') b.items.forEach(drawHouse); else drawSpecial(b); drawSign(b); });
}

function person(c, x, y, col, hair, frame, dir, s = 1) {
  const bob = frame ? 1 : 0;
  R(c, x - 5, y - 1, 10, 3, '#0003');
  R(c, x - 3, y - 4, 2, 4 - bob, '#2b2d42'); R(c, x + 1, y - 4, 2, 3 + bob, '#2b2d42');
  R(c, x - 4, y - 11, 8, 7, col); R(c, x - 4, y - 5, 8, 1, shade(col, -.3));
  R(c, x - 5, y - 10, 1, 4, col); R(c, x + 4, y - 10, 1, 4, col);
  R(c, x - 3, y - 17, 6, 6, '#f1c6a5');

function closeModals() { document.querySelectorAll('.modal').forEach(x => x.style.display = 'none'); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModals);
document.querySelectorAll('.modal').forEach(md => md.addEventListener('pointerdown', e => { if (e.target === md) closeModals(); }));
$('#btnQ').onclick = () => openModal('#mQuest'); $('#btnM').onclick = () => openModal('#mMap');

const mm = $('#minimap'), mc = mm.getContext('2d');
function drawMinimap() {
  const k = Math.max(2, Math.floor(Math.min(680, innerWidth - 60) / MW)); mm.width = MW * k; mm.height = MH * k;
  mc.fillStyle = '#c9b48a'; mc.fillRect(0, 0, mm.width, mm.height);
  mc.fillStyle = '#2d5e2c'; mc.fillRect(0, 0, mm.width, EDGE * k); mc.fillRect(0, mm.height - EDGE * k, mm.width, EDGE * k); mc.fillRect(0, 0, EDGE * k, mm.height); mc.fillRect(mm.width - EDGE * k, 0, EDGE * k, mm.height);
  const cen = b => [(b.x + b.w / 2) * k, (b.y + b.h / 2) * k], maxW = Math.max(1, ...WORLD.roads.map(r => r.w));
  blocks.forEach(b => { mc.fillStyle = shade(role(b.mainRole)[0], .35); mc.fillRect(b.x * k, b.y * k, b.w * k, b.h * k); mc.strokeStyle = '#1d1b2e'; mc.lineWidth = 2; mc.strokeRect(b.x * k, b.y * k, b.w * k, b.h * k); });
  WORLD.roads.forEach(r => { const a = blocks.find(b => b.id === r.from), b = blocks.find(x => x.id === r.to); if (!a || !b) return; const [x1, y1] = cen(a), [x2, y2] = cen(b); mc.strokeStyle = `rgba(29,27,46,${.25 + .6 * r.w / maxW})`; mc.lineWidth = 1 + 4 * r.w / maxW; mc.beginPath(); mc.moveTo(x1, y1); mc.lineTo(x2, y2); mc.stroke(); });
  mc.font = `${Math.max(7, k * 2.2)}px "Press Start 2P", monospace`; mc.textAlign = 'center';
  blocks.forEach(b => { const [x, y] = cen(b); const t = b.type === 'code' ? b.name : b.title; const w = mc.measureText(t).width + 8; mc.fillStyle = '#1d1b2ee6'; mc.fillRect(x - w / 2, y - k * 2.2 - 4, w, k * 2.2 + 9); mc.fillStyle = '#f6f1e1'; mc.fillText(t, x, y + 2); });
  const qa = targetActor(activeQuest()); if (qa) { mc.fillStyle = '#f9c74f'; mc.beginPath(); mc.arc(qa.x * k, qa.y * k, k * 1.6 + 2, 0, 7); mc.fill(); mc.strokeStyle = '#1d1b2e'; mc.stroke(); }
  mc.fillStyle = '#f94144'; mc.fillRect(player.x / T * k - k, player.y / T * k - k, k * 2 + 2, k * 2 + 2);
  mm.onpointerdown = e => {
    const r = mm.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * MW, y = (e.clientY - r.top) / r.height * MH;
    const b = blocks.find(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h);
    if (!travel(x * T, y * T)) return; closeModals(); toast('✦ Fast travel → ' + esc(b ? (b.type === 'code' ? b.name : b.title) : 'the roads'));
  };
  $('#legend').innerHTML = [...new Set(blocks.map(b => b.mainRole))].map(r => `<span><i style="background:${shade(role(r)[0], .35)}"></i>${QUARTER[r] || r}</span>`).join('');
}

/* ---------- boot ---------- */
const M = WORLD.meta;
document.title = `${M.name} · Repo World`;
$('#tRepo').textContent = `${lore.title || M.name}`;
$('#tTag').textContent = lore.tagline || `A ${M.framework} kingdom${M.since ? ' founded in ' + M.since.slice(0, 4) : ''}. Explore it, talk to its classes, slay its god objects.`;
$('#tGrid').innerHTML = [[blocks.filter(b => b.type === 'code').length, 'districts'], [fmt(M.files), 'citizens'], [fmt(M.loc), 'lines'], [M.bosses, 'bosses'], [fmt(M.commits || 0), 'commits'], [WORLD.cycles.length, 'rifts']]
  .map(([v, l]) => `<div class="px"><b>${v}</b>${l}</div>`).join('');
function start() {
  if (started) return; started = true; $('#title').style.display = 'none'; hud();
  const q = activeQuest(); if (q) setTimeout(() => toast(`NEW QUEST<br>${esc(q.title)}`), 400);
}
$('#start').onclick = start;

let last = performance.now();
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; if (started) update(dt, now); draw(now); requestAnimationFrame(loop); }
const fontReady = document.fonts ? Promise.race([document.fonts.load('8px "Press Start 2P"'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontReady.then(() => { renderMap(); requestAnimationFrame(loop); });
</script>
</body>
</html>
