<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Repo World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#10101c;--panel:#1d1b2e;--panel2:#2b2845;--ink:#f6f1e1;--dim:#a39fbf;--gold:#f9c74f;--good:#90be6d;--bad:#f94144;--line:#4b4670}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Press Start 2P",ui-monospace,monospace;touch-action:none;-webkit-user-select:none;user-select:none}
canvas#game{display:block;width:100vw;height:100vh;image-rendering:pixelated;cursor:pointer;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
.px{border:3px solid var(--line);box-shadow:0 0 0 3px #0008,inset 0 0 0 2px #0004;background:var(--panel)}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:9px;line-height:1.6}
#hud>div{pointer-events:auto;padding:8px 10px}
#where small{color:var(--dim);display:block;font-size:8px}
#stats{display:flex;align-items:center;gap:10px}
#stats button{background:var(--panel2);border:2px solid var(--line);padding:6px 8px;font-size:9px}
#xpbar{width:70px;height:8px;background:#0006;border:2px solid var(--line)}
#xpbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
#dialog{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,calc(100vw - 20px));padding:14px 16px 18px;display:none;font-size:11px;line-height:1.9;z-index:5}
#dialog h3{font-size:10px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#dialog h3 span.tag{font-size:7px;padding:3px 5px;background:var(--panel2);color:var(--dim)}
#dialog p{min-height:3.8em;word-break:break-word}
#dialog .more{position:absolute;right:12px;bottom:6px;font-size:9px;color:var(--gold);animation:blink 1s steps(2) infinite}
#dialog code{color:var(--gold);font-family:inherit}
@keyframes blink{50%{opacity:0}}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:8;padding:12px}
.modal>.px{width:min(720px,100%);max-height:88vh;overflow:auto;padding:16px;font-size:10px;line-height:1.8}
.modal h2{font-size:12px;margin-bottom:12px;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.modal h2 button{background:var(--panel2);border:2px solid var(--line);padding:4px 8px;font-size:9px;color:var(--ink)}
.quest{padding:10px;border:2px solid var(--line);margin-bottom:8px;background:var(--panel2)}
.quest.done{opacity:.5}.quest.active{border-color:var(--gold)}
.quest b{display:block;margin-bottom:4px}.quest small{color:var(--dim);font-size:8px}
#minimap{width:100%;image-rendering:pixelated;background:#0b0b14;border:2px solid var(--line);touch-action:manipulation}
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:radial-gradient(ellipse at center,#2b2550 0%,#10101c 70%);padding:16px}
#title .card{text-align:center;max-width:620px}
#title h1{font-size:clamp(20px,6vw,40px);color:var(--gold);text-shadow:4px 4px 0 #a4161a,8px 8px 0 #0008;margin-bottom:14px;letter-spacing:2px}
#title .repo{font-size:clamp(11px,3vw,15px);margin-bottom:6px}
#title .tagline{font-size:9px;color:var(--dim);margin-bottom:22px;line-height:1.8}
#title .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
#title .grid div{padding:10px 4px;font-size:8px;color:var(--dim)}
#title .grid b{display:block;font-size:13px;color:var(--ink);margin-bottom:6px}
#start{background:var(--gold);color:#1d1b2e;border:none;padding:14px 26px;font-size:12px;box-shadow:0 5px 0 #b5830f}
#start:active{transform:translateY(3px);box-shadow:0 2px 0 #b5830f}
#title .keys{margin-top:20px;font-size:8px;color:var(--dim);line-height:2}
#pad{position:fixed;inset:auto 0 calc(18px + env(safe-area-inset-bottom)) 0;display:none;justify-content:space-between;padding:0 18px;pointer-events:none;z-index:4}
#dpad{position:relative;width:138px;height:138px;pointer-events:auto}
#dpad button,#abtn{position:absolute;width:46px;height:46px;background:#1d1b2ecc;border:3px solid var(--line);font-size:14px;touch-action:none}
#dpad [data-k=up]{left:46px;top:0}#dpad [data-k=down]{left:46px;bottom:0}#dpad [data-k=left]{left:0;top:46px}#dpad [data-k=right]{right:0;top:46px}
#abtn{position:relative;width:66px;height:66px;border-radius:50%;background:#a4161acc;border-color:#f94144;pointer-events:auto;align-self:flex-end;font-size:16px}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);padding:10px 14px;font-size:10px;display:none;z-index:9;color:var(--gold);text-align:center;line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 0;font-size:8px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
body.talking #dpad{visibility:hidden}
@media (max-width:560px){#hud{font-size:8px}#xpbar{width:44px}#dialog{font-size:10px}}
</style>
</head>

</div>

/* ---------- HUD / modals ---------- */
function hud() {
  const lvl = 1 + Math.floor(save.xp / 250), pct = (save.xp % 250) / 2.5;
  $('#lvl').textContent = 'LV ' + lvl; $('#xpbar i').style.width = pct + '%';
  const aq = activeQuest();
  $('#qlist').innerHTML = QUESTS.map(q => `<div class="quest ${save.done.includes(q.id) ? 'done' : q === aq ? 'active' : ''}"><b>${save.done.includes(q.id) ? '✔' : q === aq ? '➤' : '○'} ${esc(q.title)}</b>${esc(q.text)}<br><small>+${q.xp} XP${q.hint && q !== aq ? '' : q.hint ? ' · hint: ' + esc(q.hint) : ''}</small></div>`).join('') +
    `<small style="color:var(--dim)">${save.done.length}/${QUESTS.length} complete · ${save.xp} XP</small>`;
}
let toastT = 0;
function toast(html) { const el = $('#toast'); el.innerHTML = html; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 2600); }
function openModal(id) { closeModals(); closeDialog(); hud(); $(id).style.display = 'flex'; if (id === '#mMap') drawMinimap(); keys.clear(); }
function closeModals() { document.querySelectorAll('.modal').forEach(x => x.style.display = 'none'); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModals);
document.querySelectorAll('.modal').forEach(md => md.addEventListener('pointerdown', e => { if (e.target === md) closeModals(); }));
$('#btnQ').onclick = () => openModal('#mQuest'); $('#btnM').onclick = () => openModal('#mMap');

const mm = $('#minimap'), mc = mm.getContext('2d');
function drawMinimap() {
  const k = Math.max(2, Math.floor(Math.min(680, innerWidth - 60) / MW)); mm.width = MW * k; mm.height = MH * k;
  mc.fillStyle = '#c9b48a'; mc.fillRect(0, 0, mm.width, mm.height);
  mc.fillStyle = '#2d5e2c'; mc.fillRect(0, 0, mm.width, EDGE * k); mc.fillRect(0, mm.height - EDGE * k, mm.width, EDGE * k); mc.fillRect(0, 0, EDGE * k, mm.height); mc.fillRect(mm.width - EDGE * k, 0, EDGE * k, mm.height);
  const cen = b => [(b.x + b.w / 2) * k, (b.y + b.h / 2) * k], maxW = Math.max(1, ...WORLD.roads.map(r => r.w));
  blocks.forEach(b => { mc.fillStyle = shade(role(b.mainRole)[0], .35); mc.fillRect(b.x * k, b.y * k, b.w * k, b.h * k); mc.strokeStyle = '#1d1b2e'; mc.lineWidth = 2; mc.strokeRect(b.x * k, b.y * k, b.w * k, b.h * k); });
  WORLD.roads.forEach(r => { const a = blocks.find(b => b.id === r.from), b = blocks.find(x => x.id === r.to); if (!a || !b) return; const [x1, y1] = cen(a), [x2, y2] = cen(b); mc.strokeStyle = `rgba(29,27,46,${.25 + .6 * r.w / maxW})`; mc.lineWidth = 1 + 4 * r.w / maxW; mc.beginPath(); mc.moveTo(x1, y1); mc.lineTo(x2, y2); mc.stroke(); });
  mc.font = `${Math.max(7, k * 2.2)}px "Press Start 2P", monospace`; mc.textAlign = 'center';
  blocks.forEach(b => { const [x, y] = cen(b); const t = b.type === 'code' ? b.name : b.title; const w = mc.measureText(t).width + 8; mc.fillStyle = '#1d1b2ee6'; mc.fillRect(x - w / 2, y - k * 2.2 - 4, w, k * 2.2 + 9); mc.fillStyle = '#f6f1e1'; mc.fillText(t, x, y + 2); });
  const qa = targetActor(activeQuest()); if (qa) { mc.fillStyle = '#f9c74f'; mc.beginPath(); mc.arc(qa.x * k, qa.y * k, k * 1.6 + 2, 0, 7); mc.fill(); mc.strokeStyle = '#1d1b2e'; mc.stroke(); }
  mc.fillStyle = '#f94144'; mc.fillRect(player.x / T * k - k, player.y / T * k - k, k * 2 + 2, k * 2 + 2);
  mm.onpointerdown = e => {
    const r = mm.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * MW, y = (e.clientY - r.top) / r.height * MH;
    const b = blocks.find(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h);
    if (!travel(x * T, y * T)) return; closeModals(); toast('✦ Fast travel → ' + esc(b ? (b.type === 'code' ? b.name : b.title) : 'the roads'));
  };
  $('#legend').innerHTML = [...new Set(blocks.map(b => b.mainRole))].map(r => `<span><i style="background:${shade(role(r)[0], .35)}"></i>${QUARTER[r] || r}</span>`).join('');
}

/* ---------- boot ---------- */
const M = WORLD.meta;
document.title = `${M.name} · Repo World`;
$('#tRepo').textContent = `${lore.title || M.name}`;
$('#tTag').textContent = lore.tagline || `A ${M.framework} kingdom${M.since ? ' founded in ' + M.since.slice(0, 4) : ''}. Explore it, talk to its classes, slay its god objects.`;
$('#tGrid').innerHTML = [[blocks.filter(b => b.type === 'code').length, 'districts'], [fmt(M.files), 'citizens'], [fmt(M.loc), 'lines'], [M.bosses, 'bosses'], [fmt(M.commits || 0), 'commits'], [WORLD.cycles.length, 'rifts']]
  .map(([v, l]) => `<div class="px"><b>${v}</b>${l}</div>`).join('');
function start() {
  if (started) return; started = true; $('#title').style.display = 'none'; hud();
  const q = activeQuest(); if (q) setTimeout(() => toast(`NEW QUEST<br>${esc(q.title)}`), 400);
}
$('#start').onclick = start;

let last = performance.now();
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; if (started) update(dt, now); draw(now); requestAnimationFrame(loop); }
const fontReady = document.fonts ? Promise.race([document.fonts.load('8px "Press Start 2P"'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontReady.then(() => { renderMap(); requestAnimationFrame(loop); });
</script>
</body>
</html>
